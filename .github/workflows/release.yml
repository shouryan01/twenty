name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: 0.1.${{ github.run_number }}

jobs:
  changes:
    name: Detect changed platforms
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      windows: ${{ steps.targets.outputs.windows }}
      macos: ${{ steps.targets.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test change detection
        run: python3 .github/scripts/test_detect_build_targets.py

      - name: Detect build targets
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: >
          python3 .github/scripts/detect-build-targets.py
          --event "$EVENT_NAME" --before "$BEFORE_SHA" --after "$AFTER_SHA"

  build-windows:
    name: Build Windows
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-publish
        with:
          project: Windows/twenty.csproj
          name: windows-x64
          version: ${{ env.VERSION }}

  build-macos:
    name: Build macOS (Apple silicon)
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build app (unsigned)
        run: >
          xcodebuild -project Mac/twenty.xcodeproj -scheme twenty
          -configuration Release -destination "generic/platform=macOS"
          -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=NO
          MARKETING_VERSION=${{ env.VERSION }}
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build

      - name: Package
        run: |
          mkdir -p dist
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "dist/twenty-${{ env.VERSION }}-macos-arm64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: twenty-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Create release
    needs: [changes, build-windows, build-macos]
    # A skipped platform must not skip release; failed/cancelled builds must.
    if: >-
      ${{ always() && !cancelled() &&
          needs.changes.result == 'success' &&
          (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
          (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
          (needs.build-windows.result == 'success' || needs.build-macos.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ env.VERSION }}" artifacts/* \
            --target "${{ github.sha }}" \
            --title "v${{ env.VERSION }}" \
            --generate-notes
