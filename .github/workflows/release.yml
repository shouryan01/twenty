name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: 0.1.${{ github.run_number }}

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-publish
        with:
          project: Windows/twenty.csproj
          rid: win-x64
          name: windows-x64
          version: ${{ env.VERSION }}

  build-macos:
    name: Build macOS (Apple silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build app (unsigned)
        run: >
          xcodebuild -project Mac/twenty.xcodeproj -scheme twenty
          -configuration Release -destination "generic/platform=macOS"
          -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=NO
          MARKETING_VERSION=${{ env.VERSION }}
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build

      - name: Package
        run: |
          mkdir -p dist
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "dist/twenty-${{ env.VERSION }}-macos-arm64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: twenty-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Create release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ env.VERSION }}" artifacts/* \
            --target "${{ github.sha }}" \
            --title "v${{ env.VERSION }}" \
            --generate-notes
