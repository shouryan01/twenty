name: Build and package
description: Build a .NET Framework project into one exe and upload it.
inputs:
  project:
    description: Path to the .csproj file
    required: true
  name:
    description: Short platform name used in file names
    required: true
  version:
    description: App version
    required: true
  dotnet-version:
    description: .NET SDK version
    default: 10.0.x
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Build
      shell: bash
      run: >
        dotnet build "${{ inputs.project }}" -c Release
        -p:Version=${{ inputs.version }} -o publish

    - name: Package
      shell: bash
      run: |
        mkdir -p dist
        # One .exe for .NET Framework 4.8. Windows 10 and 11 include it.
        # Costura embeds the DLLs, so there are no extra files.
        cp publish/twenty.exe "dist/twenty-${{ inputs.version }}-${{ inputs.name }}.exe"

    - uses: actions/upload-artifact@v7
      with:
        name: twenty-${{ inputs.name }}
        path: dist/*
        if-no-files-found: error
